services:
  postgres:
    image: postgres:17.10-alpine3.24
    container_name: postgres-social-feed
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - pgsql:/var/lib/postgresql/data

  redis:
    image: redis:8.6.2-alpine3.23
    container_name: redis-social-feed
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  pgsql:
    name: social-feed_pgsql
  redis-data:
    name: social-feed_redis
